<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handwriting Module</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap + Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(to right, #dfe9f3, #ffffff);
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      padding: 40px;
      margin-top: 50px;
      position: relative;
    }
    h2 {
      color: #4a00e0;
      font-weight: bold;
    }
    .btn-primary {
      background-color: #4a00e0;
      border: none;
    }
    .btn-primary:hover {
      background-color: #3500b4;
    }
    .preview-img {
      max-height: 150px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .back-button {
      position: absolute;
      top: 20px;
      right: 30px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Back to Dashboard Button -->
  <a href="/dashboard" class="btn btn-outline-secondary back-button">
    <i class="fas fa-arrow-left"></i> Back to Dashboard
  </a>

  <h2 class="text-center mb-4"><i class="fas fa-signature"></i> Handwriting Analysis</h2>

  <form method="POST" enctype="multipart/form-data">
    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label">🌀 Upload Spiral Image:</label>
        <input type="file" name="spiral_img" class="form-control" accept="image/*" onchange="previewImage(event, 'spiralPreview')" required>
        <img id="spiralPreview" class="mt-3 preview-img d-none" alt="Spiral Preview">
      </div>
      <div class="col-md-6">
        <label class="form-label">🌊 Upload Wave Image:</label>
        <input type="file" name="wave_img" class="form-control" accept="image/*" onchange="previewImage(event, 'wavePreview')" required>
        <img id="wavePreview" class="mt-3 preview-img d-none" alt="Wave Preview">
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-4">🔍 Analyze Handwriting</button>
  </form>

  {% if spiral_result or wave_result %}
    <div class="alert alert-info mt-4">
      <h5><i class="fas fa-chart-line"></i> Results:</h5>
      <p><strong>Spiral:</strong> {{ spiral_result }}</p>
      <p><strong>Wave:</strong> {{ wave_result }}</p>
    </div>
  {% endif %}
</div>

<script>
  function previewImage(event, targetId) {
    const reader = new FileReader();
    reader.onload = function(){
      const output = document.getElementById(targetId);
      output.src = reader.result;
      output.classList.remove('d-none');
    };
    reader.readAsDataURL(event.target.files[0]);
  }
</script>

</body>
</html>
