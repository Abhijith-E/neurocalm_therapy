<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap & Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(to right, #dfe9f3, #ffffff);
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      padding: 50px;
      margin-top: 60px;
      position: relative;
      max-width: 700px;
    }

    h2 {
      color: #4a00e0;
      font-weight: bold;
    }

    .btn-primary {
      background-color: #4a00e0;
      border: none;
      font-size: 18px;
      padding: 12px 20px;
    }

    .btn-primary:hover {
      background-color: #3500b4;
    }

    .back-button {
      position: absolute;
      top: 20px;
      right: 30px;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
    }

    .alert {
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Back Button -->
  <a href="/dashboard" class="btn btn-outline-secondary back-button">
    <i class="fas fa-arrow-left"></i> Back to Dashboard
  </a>

  <h2 class="text-center mb-4"><i class="fas fa-microphone"></i> Voice Analysis</h2>

  <form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="audioFile" class="form-label">🎤 Upload Voice Sample:</label>
      <input type="file" class="form-control" id="audioFile" name="audioFile" accept=".wav" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 mt-3">🔍 Analyze Voice</button>
  </form>

  {% if prediction %}
    <div class="alert alert-info mt-4">
      <h5><i class="fas fa-chart-line"></i> Result:</h5>
      <p>{{ prediction }}</p>
    </div>
  {% endif %}
</div>

</body>
</html>
